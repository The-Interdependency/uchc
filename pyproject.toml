[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3", "packaging==26.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uchc"
version = "0.2.0a4"
description = "Unit Circle Hyperspace Constructs: exact language construction and receipt-bound inference inputs"
readme = "README.md"
requires-python = ">=3.12"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Erin Spencer"}]
dependencies = []

[project.scripts]
uchc-halving = "uchc_halving.cli:main"

[project.optional-dependencies]
halving = ["ucns @ git+https://github.com/The-Interdependency/ucns.git@1edfa593ae9d8c9ad394b5462638bcc717f99fbd"]
corpus-build = ["PyYAML==6.0.2"]
test = ["pytest==8.3.5"]

[tool.setuptools]
packages = ["english_gonol", "english_gonol.language", "english_gonol.language.data", "english_gonol.data", "python_gonol", "uchc_polyglot", "uchc_halving"]
package-dir = {english_gonol = "human/english/english_gonol", python_gonol = "programming/python/python_gonol", uchc_polyglot = "shared/polyglot/uchc_polyglot", uchc_halving = "shared/uchc_halving"}

[tool.setuptools.package-data]
english_gonol = ["data/*.json", "language/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["human/english/tests", "programming/python/tests", "shared/polyglot/tests"]
pythonpath = ["human/english", "programming/python", "shared/polyglot", "shared"]
