name: Release ordinal halving v1
on:
  pull_request:
    paths: ['releases/ordinal-halving-v1.sha256', '.github/workflows/release-ordinal-halving.yml']
  push:
    branches: [main]
    paths: ['releases/ordinal-halving-v1.sha256']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.14'
      - name: Reproduce the exact verified wheel
        env:
          SOURCE_DATE_EPOCH: '1795478400'
        run: |
          python -m pip install setuptools==82.0.1 wheel==0.46.3 packaging==26.0
          python -m pip wheel --no-deps --no-build-isolation . -w _release
          cd _release
          sha256sum -c ../releases/ordinal-halving-v1.sha256
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ordinal-halving-wheel
          path: _release/*.whl
          if-no-files-found: error
  publish:
    if: github.event_name == 'push'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ordinal-halving-wheel
          path: _release
      - name: Publish the verified wheel without replacing an existing asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _release
          sha256sum -c ../releases/ordinal-halving-v1.sha256
          if gh release view ordinal-halving-v1 >/dev/null 2>&1; then
            mkdir previous
            gh release download ordinal-halving-v1 --pattern '*.whl' --dir previous
            (cd previous && sha256sum -c ../../releases/ordinal-halving-v1.sha256)
          else
            gh release create ordinal-halving-v1 *.whl ../releases/ordinal-halving-v1.sha256 \
              --target "$GITHUB_SHA" --title 'Ordinal radius-halving v1' \
              --notes 'UCHC ordinal-halving/1 for Unicode words and nested disc stacks. The attached wheel is verified by SHA-256. The release scope is ordinal halving.'
          fi
