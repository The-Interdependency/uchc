# Usage: pushes to the integration branch rebuild and verify the complete pinned
# English corpus. Artifacts are evidence, not a stable release or inference claim.
name: English full-corpus replay
on:
  push:
    branches: [work/zfae-inference-contract]
    paths:
      - .github/workflows/english-full-corpus.yml
      - human/english/**
      - pyproject.toml
      - tools/verify_inference_corpus.py
  pull_request:
    paths:
      - .github/workflows/english-full-corpus.yml
      - human/english/**
      - pyproject.toml
      - tools/verify_inference_corpus.py
permissions:
  contents: read
jobs:
  complete-corpus:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve immutable inputs and preflight storage
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(df --output=avail -B1 . | tail -1)" -gt 8589934592
          fetch_source() {
            local repository="$1" directory="$2" sha="$3"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            git init -q "$directory"
            git -C "$directory" remote add origin "https://github.com/$repository.git"
            git -C "$directory" fetch --quiet --depth=1 origin "$sha"
            git -C "$directory" checkout -q --detach FETCH_HEAD
            test "$(git -C "$directory" rev-parse HEAD)" = "$sha"
          }
          fetch_source The-Interdependency/uchc source "$SOURCE_SHA"
          fetch_source globalwordnet/english-wordnet oewn dc343f2683279ecbb13fab4e2fd778d7b162d287
          fetch_source The-Interdependency/ucns ucns 4f863ad37096b7baab8f62820ad5cb937b62a3a7
          python3 --version
          python3 -m venv .venv
          .venv/bin/python -m pip install pytest==8.3.5 PyYAML==6.0.2
      - name: Test existing construction contracts
        shell: bash
        run: |
          set -euo pipefail
          cd source/human/english
          ../../../.venv/bin/python -m pytest -q tests/test_full_construct_run.py tests/test_source_order.py tests/test_gonol_language_authority.py tests/test_hyperspace_construct.py
      - name: Build every admitted word and definition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          cd source/human/english
          ../../../.venv/bin/python -m english_gonol.full_construct_run \
            --source-root ../../../oewn/src/yaml \
            --ucns-source-root ../../../ucns \
            --out-dir ../../../evidence/full-construct
      - name: Independently replay complete logical and hyperspace receipts
        shell: bash
        env:
          PYTHONPATH: source/human/english
        run: |
          set -euo pipefail
          .venv/bin/python - <<'PY'
          import hashlib, json, sqlite3
          from pathlib import Path
          from english_gonol.full_construct_run import verify_replay
          from english_gonol.hyperspace_construct import hyperspace_receipt
          root = Path('evidence/full-construct')
          manifest = verify_replay(root)
          assert manifest['receipt_sha256'] == '12277b4959c0c72b7af12097b8a77bf91866bbf669e7f4ac07b6a5f1426ebb57'
          hyper = hyperspace_receipt(root)
          assert hyper['limit'] is None
          assert (hyper['glyph_axis_count'], hyper['word_axis_count'], hyper['definition_axis_count']) == (118, 164864, 185155)
          assert hyper['receipt_sha256'] == '38b51ab5ebcf7d3e95f3b29700a170d1e7b6d3342dd6088171c5c078a08753d2'
          with sqlite3.connect(f'file:{root / "construct.db"}?mode=ro', uri=True) as db:
              assert db.execute('PRAGMA integrity_check').fetchone() == ('ok',)
              assert db.execute('PRAGMA foreign_key_check').fetchall() == []
          data = root / 'construct.db'
          with data.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          result = {'database_sha256': digest, 'database_bytes': data.stat().st_size, 'logical_receipt': manifest['receipt_sha256'], 'hyperspace': hyper, 'scope': 'complete pinned English corpus; not a neural inference evaluation'}
          Path('evidence/full-corpus-replay.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
          mkdir -p evidence/corpus-attribution
          git -C oewn ls-files | grep -Ei '(^|/)(licen[sc]e|copying|notice|readme)(\.|$)' | while IFS= read -r path; do
            mkdir -p "evidence/corpus-attribution/$(dirname "$path")"
            cp "oewn/$path" "evidence/corpus-attribution/$path"
          done
          printf '%s\n' 'Corpus: globalwordnet/english-wordnet@dc343f2683279ecbb13fab4e2fd778d7b162d287' 'Construction: The-Interdependency/uchc' 'UCNS: The-Interdependency/ucns@4f863ad37096b7baab8f62820ad5cb937b62a3a7' > evidence/PROVENANCE.txt
      - name: Retain complete artifact and replay evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: english-full-corpus
          path: evidence/
          retention-days: 7
          if-no-files-found: error
