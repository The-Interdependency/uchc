name: Ordinal halving installed package
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  halving:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/ucns
          ref: 1edfa593ae9d8c9ad394b5462638bcc717f99fbd
          path: _deps/native
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.14'
      - name: Build and exercise the installed halving package
        run: |
          set -eu
          python -m pip install pytest==8.3.5 setuptools==82.0.1 wheel==0.46.3 packaging==26.0
          python -m pip wheel --no-deps --no-build-isolation . _deps/native -w _dist
          python -m venv _clean
          _clean/bin/python -m pip install pytest==8.3.5
          _clean/bin/python -m pip install --no-deps _dist/*.whl
          mkdir _isolated
          cp tests/test_halving.py tests/test_numerology.py _isolated/
          cp tests/ordinal-halving-v1-record.json _isolated/
          _clean/bin/python -I -m pytest -c /dev/null --noconftest -q _isolated
          _clean/bin/python -I -m english_gonol bull > _isolated/bull.json
          python -c "import json; assert json.load(open('_isolated/bull.json'))['radii'] == [[1,16],[1,8],[1,4],[1,2]]"
