name: English recursive attachment
on:
  pull_request:
    paths: ['human/english/**', 'tests/test_attachment*.py', 'tools/verify_attachment_extraction.py', 'docs/work-graphs/english-recursive-attachment-v1.json', 'pyproject.toml', '.github/workflows/english-recursive-attachment.yml']
  push:
    branches: [main]
    paths: ['human/english/**', 'tests/test_attachment*.py', 'tools/verify_attachment_extraction.py', 'docs/work-graphs/english-recursive-attachment-v1.json', 'pyproject.toml', '.github/workflows/english-recursive-attachment.yml']
permissions:
  contents: read
jobs:
  complete-installed-consumer:
    runs-on: ubuntu-24.04
    env:
      SOURCE_DATE_EPOCH: '1790308800'
      UCHC_STRUCTURAL_FIELD: ${{ github.workspace }}/_state/field
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/ucns
          ref: 9cc00771e54336d58ee377faeec87a3a33dbd4bf
          path: _deps/native
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/stack
          ref: 86a5fb1936dc6ca04ad6fb9bb161ea3fd7f4da88
          path: _deps/forge
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: globalwordnet/english-wordnet
          ref: dc343f2683279ecbb13fab4e2fd778d7b162d287
          path: _deps/oewn
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: The-Interdependency/ucns
          ref: 4f863ad37096b7baab8f62820ad5cb937b62a3a7
          path: _deps/corpus-carrier
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12.14'
      - name: Build and install exact artifacts
        run: |
          test "$(git -C _deps/native rev-parse HEAD)" = 9cc00771e54336d58ee377faeec87a3a33dbd4bf
          test "$(git -C _deps/oewn rev-parse HEAD)" = dc343f2683279ecbb13fab4e2fd778d7b162d287
          test "$(git -C _deps/corpus-carrier rev-parse HEAD)" = 4f863ad37096b7baab8f62820ad5cb937b62a3a7
          python -m pip install pytest==8.3.5 PyYAML==6.0.2 setuptools==82.0.1 wheel==0.46.3 packaging==26.0
          python -m pip wheel --no-deps ./_deps/native -w _state/native-dist
          python -m pip install --no-deps _state/native-dist/*.whl
          python -m pip wheel --no-deps --no-build-isolation . -w _state/dist
          python -m venv _state/clean
          _state/clean/bin/python -m pip install pytest==8.3.5 PyYAML==6.0.2
          _state/clean/bin/python -m pip install --no-deps _state/native-dist/*.whl _state/dist/uchc-0.1.0a4-py3-none-any.whl
          mkdir -p _state/isolated
          cp tests/test_attachment*.py _state/isolated/
      - name: Verify source closure and isolated installed imports
        env:
          PYTHONPATH: human/english
        run: |
          python tools/verify_attachment_extraction.py _deps/forge > _state/source-extraction.json
          _state/clean/bin/python -I tools/verify_attachment_extraction.py _deps/forge > _state/installed-extraction.json
          cmp _state/source-extraction.json _state/installed-extraction.json
          python -m pytest -c /dev/null -q tests/test_attachment_construction.py --junitxml=_state/source.xml
      - name: Build complete historical corpus through installed package
        run: |
          _state/clean/bin/python -I -m english_gonol.structural_construct build --source-root _deps/oewn/src/yaml --ucns-source-root _deps/corpus-carrier --out-dir _state/field > _state/corpus-build.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('_state/field/manifest.json').read_text())
          assert manifest['receipt_sha256'] == '26ab095f73306ff4fbd9f67d1c282c1df79f926bb75cc081c879db8a6989b58a'
          PY
      - name: Verify complete corpus queries and all ownership overlays
        env:
          PYTHONPATH: _deps/forge/research/english-gonol
        run: |
          python -m pytest -c /dev/null -q _deps/forge/research/english-gonol/ordinal_tests/test_attachment*.py --junitxml=_state/forge.xml
          _state/clean/bin/python -I -m pytest -c /dev/null -q _state/isolated --junitxml=_state/installed.xml
          python -m english_gonol.attachment_audit _state/field > _state/audit-forge.json
          _state/clean/bin/python -I -m english_gonol.attachment_audit _state/field > _state/audit-installed.json
          cmp _state/audit-forge.json _state/audit-installed.json
      - name: Compare CLI operations and record exact candidate evidence
        env:
          UCHC_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, sys, xml.etree.ElementTree as E
          from pathlib import Path
          operations = [('word','bull'), ('compound','bull','shit'), ('sequence','bull','shit','--bearing','root-endpoint-v1'), ('sequence','bull','shit','--bearing','exit-heading-v1')]
          outputs = []
          for args in operations:
              values = []
              for prefix, source in (([sys.executable], 'human/english'), ([sys.executable], '_deps/forge/research/english-gonol'), ([str(Path('_state/clean/bin/python').absolute()), '-I'], '')):
                  env = dict(os.environ, PYTHONPATH=str(Path(source).resolve()))
                  values.append(subprocess.check_output(prefix + ['-m','english_gonol.attachment_construction',*args], env=env))
              assert values[0] == values[1] == values[2], args
              outputs.append({'operation': args, 'sha256': hashlib.sha256(values[0]).hexdigest()})
          tests = {}
          for name, count in (('source',5),('forge',11),('installed',11)):
              suites = list(E.parse('_state/'+name+'.xml').getroot().iter('testsuite'))
              totals = {k: sum(int(s.get(k,0)) for s in suites) for k in ('tests','failures','errors','skipped')}
              assert totals == {'tests':count,'failures':0,'errors':0,'skipped':0}, totals
              tests[name] = totals
          sha = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          assert sha == os.environ['UCHC_SOURCE_COMMIT']
          audit = json.loads(Path('_state/audit-installed.json').read_text())
          assert audit['counts']['words'] == 103053
          assert audit['counts']['formerly_compound_definitions'] == 57155
          wheel = Path('_state/dist/uchc-0.1.0a4-py3-none-any.whl')
          evidence = {'schema':'uchc.recursive-attachment-acceptance.v1','uchc_source_commit':sha,'forge_commit':'86a5fb1936dc6ca04ad6fb9bb161ea3fd7f4da88','ucns_commit':'9cc00771e54336d58ee377faeec87a3a33dbd4bf','tests':tests,'operations':outputs,'audit':audit,'wheel_sha256':hashlib.sha256(wheel.read_bytes()).hexdigest(),'authority_transfer':False,'bearing_selection':'none'}
          Path('_state/recursive-evidence.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: uchc-recursive-attachment
          path: |
            _state/*.json
            _state/*.xml
